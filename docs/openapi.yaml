          $ref: "#/components/responses/Unauthorized"
  /api/observability/metrics:
    get:
      tags: [Observability]
      summary: Prometheus metrics export
      operationId: getPrometheusMetrics
      description: >
        Returns process-local request metrics. Authenticated admins may call this
        endpoint with a session, or scrapers may use `Authorization: Bearer`
        when `GC_METRICS_TOKEN` is configured.
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  parameters:
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DealId:
      name: dealId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Not authenticated or locked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated request failed CSRF, origin, or authorization checks
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Entity not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: State conflict or duplicate
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]
            database:
              type: string
              enum: [ok]
    AuthStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [setupComplete, sessionValid, dekLoaded]
          properties:
            setupComplete:
              type: boolean
            sessionValid:
              type: boolean
            dekLoaded:
              type: boolean
            features:
              $ref: "#/components/schemas/PublicFeatureFlags"
            user:
              $ref: "#/components/schemas/AuthUser"
            csrfToken:
              type: string
            recoveryCodes:
              type: object
              properties:
                activeCount:
                  type: integer
                  minimum: 0
    PublicFeatureFlags:
      type: object
      required:
        - plaintextJsonExport
        - rawDatabaseExport
        - csvImport
        - referenceValueHints
        - networkSecurityCodeStorage
      properties:
        plaintextJsonExport:
          type: boolean
        rawDatabaseExport:
          type: boolean
        csvImport:
          type: boolean
        referenceValueHints:
          type: boolean
        networkSecurityCodeStorage:
          type: boolean
    AuthUser:
      type: object
      required: [id, accountId, role]
      properties:
        id:
          type: integer
        accountId:
          type: integer
        role:
          type: string
          enum: [owner, admin, operator, viewer]
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
    ObservabilitySummaryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [startedAt, uptimeSeconds, requests]
          properties:
            startedAt:
              type: string
              format: date-time
            uptimeSeconds:
              type: integer
              minimum: 0
            requests:
              type: object
              required: [total, errorCount, averageDurationMs, maxDurationMs, byStatusClass, byMethod]
              properties:
                total:
                  type: integer
                  minimum: 0
                errorCount:
                  type: integer
                  minimum: 0
                averageDurationMs:
                  type: number
                  minimum: 0
                maxDurationMs:
                  type: number
                  minimum: 0
                byStatusClass:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 0
                byMethod:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 0
    SetupRequest:
      type: object
      required: [unlockSecret]
      properties:
        unlockSecret:
          type: string
          minLength: 8
        displayName:
          type: string
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      required: [unlockSecret]
      properties:
        email:
          type: string
          format: email
          description: Required when more than one active user exists.
        unlockSecret:
          type: string
    AcceptInviteRequest:
      type: object
      required: [email, inviteCode, unlockSecret]
      properties:
        email:
          type: string
          format: email
        inviteCode:
          type: string
          description: One-time invite code shown once to an admin when the invite is created.
        unlockSecret:
          type: string
          minLength: 8
          description: User-chosen unlock secret; admins do not create this secret for the user.
    GenerateRecoveryCodesRequest:
      type: object
      required: [currentUnlockSecret]
      properties:
        currentUnlockSecret:
          type: string
    RecoveryCodesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [codes, generatedAt, activeCount]
          properties:
            codes:
              type: array
              description: One-time recovery codes shown once. Older unused codes are revoked.
              items:
                type: string
            generatedAt:
              type: string
              format: date-time
            activeCount:
              type: integer
              minimum: 0
    RecoverUnlockSecretRequest:
      type: object
      required: [recoveryCode, newUnlockSecret]
      properties:
        email:
          type: string
          format: email
          description: Required when more than one active user exists.
        recoveryCode:
          type: string
        newUnlockSecret:
          type: string
          minLength: 8
    ChangeUnlockSecretRequest:
      type: object
      required: [oldUnlockSecret, newUnlockSecret]
      properties:
        oldUnlockSecret:
          type: string
        newUnlockSecret:
          type: string
          minLength: 8
    CardStatus:
      type: string
      enum: [available, reserved, in_use, sold, used_up, void]
    CardType:
      type: string
      enum: [merchant, prepaid]
    CredentialProfile:
      type: string
      enum: [claim_code, merchant_number_pin, barcode, network_prepaid, custom]
    CredentialFieldKind:
      type: string
      enum:
        - primary_code
        - card_number
        - pin
        - access_code
        - barcode_value
        - expiration_month
        - expiration_year
        - network_security_code
        - billing_postal_code
        - cardholder_name
        - billing_address
        - metadata
    CredentialSummary:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/CredentialProfile"
        primaryLabel:
          type: string
          nullable: true
        primaryLast4:
          type: string
          nullable: true
        primaryHint:
          type: string
          nullable: true
        fieldCount:
          type: integer
        hasPin:
          type: boolean
        hasBillingZip:
          type: boolean
        hasBarcode:
          type: boolean
    CredentialFieldInput:
      type: object
      properties:
        fieldKey:
          type: string
        label:
          type: string
        fieldKind:
          $ref: "#/components/schemas/CredentialFieldKind"
        value:
          type: string
        barcodeFormat:
          type: string
          enum: [code128, qr, ean13, upca, pdf417, aztec, data_matrix, other]
        copyable:
          type: boolean
    CredentialsInput:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/CredentialProfile"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/CredentialFieldInput"
    Network:
      type: string
      enum: [visa, mastercard, amex, discover, other]
    Card:
      type: object
      required:
        - id
        - accountId
        - brand
        - cardType
        - faceValueCents
        - remainingBalanceCents
        - purchaseCostCents
        - status
        - rowVersion
      properties:
        id:
          type: integer
        accountId:
          type: integer
        dealId:
          type: integer
          nullable: true
        brand:
          type: string
        cardType:
          $ref: "#/components/schemas/CardType"
        network:
          $ref: "#/components/schemas/Network"
        faceValueCents:
          type: integer
          minimum: 1
        remainingBalanceCents:
          type: integer
          minimum: 0
        purchaseCostCents:
          type: integer
          minimum: 0
        cardNumberLast4:
          type: string
          nullable: true
        credentialProfile:
          $ref: "#/components/schemas/CredentialProfile"
        credentialSummary:
          $ref: "#/components/schemas/CredentialSummary"
        source:
          type: string
          nullable: true
        expirationDate:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/CardStatus"
        reservedFor:
          type: string
          nullable: true
        reservedUntil:
          type: string
          nullable: true
        reservedNotes:
          type: string
          nullable: true
        latestSalePriceCents:
          type: integer
          nullable: true
        rowVersion:
          type: integer
    CardInput:
      type: object
      required: [brand, cardType, faceValueCents]
      properties:
        brand:
          type: string
        cardType:
          $ref: "#/components/schemas/CardType"
        network:
          $ref: "#/components/schemas/Network"
        credentialProfile:
          $ref: "#/components/schemas/CredentialProfile"
        credentials:
          $ref: "#/components/schemas/CredentialsInput"
        faceValueCents:
          type: integer
          minimum: 1
        purchaseCostCents:
          type: integer
          minimum: 0
        cardNumber:
          type: string
        pin:
          type: string
        billingZip:
          type: string
        primaryCode:
          type: string
        accessCode:
          type: string
        barcodeValue:
          type: string
        barcodeFormat:
          type: string
        expirationMonth:
          type: string
        expirationYear:
          type: string
        networkSecurityCode:
          type: string
          description: Accepted only when deployment policy enables local network security-code storage.
        billingPostalCode:
          type: string
        cardholderName:
          type: string
        billingAddress:
          type: string
        expirationDate:
          type: string
        notes:
          type: string
    CreateCardsRequest:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CardInput"
    UpdateCardRequest:
      type: object
      properties:
        rowVersion:
          type: integer
          minimum: 1
        brand:
          type: string
        cardType:
          $ref: "#/components/schemas/CardType"
        network:
          type: string
          nullable: true
          enum: [visa, mastercard, amex, discover, other]
        faceValueCents:
          type: integer
          minimum: 1
        remainingBalanceCents:
          type: integer
          minimum: 0
        purchaseCostCents:
          type: integer
          minimum: 0
        notes:
          type: string
          nullable: true
        expirationDate:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
          enum: [digital, physical]
        source:
          type: string
          nullable: true
    ReserveCardRequest:
      type: object
      properties:
        reservedFor:
          type: string
        reservedUntil:
          type: string
        reservedNotes:
          type: string
    SellCardRequest:
      type: object
      required: [salePriceCents]
      properties:
        salePriceCents:
          type: integer
          minimum: 0
        buyerName:
          type: string
        buyerType:
          type: string
          enum: [dealer, group_chat, friend, self, other]
        platform:
          type: string
        transactionDate:
          type: string
        notes:
          type: string
    UndoSaleRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
    UseCardRequest:
      type: object
      required: [amountCents]
      properties:
        amountCents:
          type: integer
          minimum: 1
        merchant:
          type: string
        description:
          type: string
        usageDate:
          type: string
    UndoUsageRequest:
      type: object
      required: [usageId, reason]
      properties:
        usageId:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
    VoidCardRequest:
      type: object
      properties:
        reason:
          type: string
    Deal:
      type: object
      required: [id, accountId, name, rowVersion]
      properties:
        id:
          type: integer
        accountId:
          type: integer
        name:
          type: string
        source:
          type: string
          nullable: true
        purchaseDate:
          type: string
          nullable: true
        inputTotalCostCents:
          type: integer
          nullable: true
          minimum: 0
        notes:
          type: string
          nullable: true
        archivedAt:
          type: string
          nullable: true
        rowVersion:
          type: integer
    CreateDealRequest:
      type: object
      properties:
        name:
          type: string
          description: Optional title; if omitted the server falls back to source or a default title.
        source:
          type: string
        purchaseDate:
          type: string
        totalCostCents:
          type: integer
          minimum: 0
        notes:
          type: string
        cards:
