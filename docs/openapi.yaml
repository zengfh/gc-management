openapi: 3.1.0
info:
  title: Secure Gift Card Manager API
  version: 0.1.0
  description: >
    Initial API contract for the local MVP. The implementation must keep this
    file in sync with backend routes and QA requirement IDs.
servers:
  - url: http://localhost:3001
    description: Local API server
tags:
  - name: Health
  - name: Auth
  - name: Cards
  - name: Deals
  - name: ReferenceValues
  - name: ImportExport
  - name: Settings
  - name: Users
  - name: Admin
  - name: Audit
  - name: Observability
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/auth/status:
    get:
      tags: [Auth]
      summary: Current setup/session/unlock state
      operationId: getAuthStatus
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResponse"
  /api/auth/setup:
    post:
      tags: [Auth]
      summary: Create the first account/user and wrapped DEK
      operationId: setupAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Setup complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Unlock encrypted data
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Clear session and in-memory unlock state
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Logout complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/accept-invite:
    post:
      tags: [Auth]
      summary: Accept a one-time user invite and create the invited user's unlock secret
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "201":
          description: Invite accepted and session unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/recovery-codes:
    post:
      tags: [Auth]
      summary: Generate replacement one-time recovery codes for the current user
      operationId: generateRecoveryCodes
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRecoveryCodesRequest"
      responses:
        "201":
          description: Recovery codes generated and shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/recover:
    post:
      tags: [Auth]
      summary: Reset an unlock secret with a one-time recovery code
      operationId: recoverUnlockSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverUnlockSecretRequest"
      responses:
        "200":
          description: Unlock secret reset; user must sign in with the new unlock secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/change-unlock-secret:
    post:
      tags: [Auth]
      summary: Rewrap the DEK with a new unlock secret
      operationId: changeUnlockSecret
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeUnlockSecretRequest"
      responses:
        "200":
          description: Secret changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/cards:
    get:
      tags: [Cards]
      summary: List cards
      operationId: listCards
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CardStatus"
        - name: cardType
          in: query
          schema:
            $ref: "#/components/schemas/CardType"
        - name: activeOnly
          in: query
          description: When true, limits results to active cards with remaining balance.
          schema:
            type: boolean
        - name: brand
          in: query
          schema:
            type: string
        - name: cardNumber
          in: query
          description: Legacy exact full card-number search. Backend normalizes and blind-indexes input.
          schema:
            type: string
        - name: credential
          in: query
          description: Exact credential search across indexed card numbers, claim codes, and barcode values.
          schema:
            type: string
      responses:
        "200":
          description: Cards page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Cards]
      summary: Create one or more cards
      operationId: createCards
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardsRequest"
      responses:
        "201":
          description: Cards created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/cards/{cardId}:
    parameters:
      - $ref: "#/components/parameters/CardId"
    get:
      tags: [Cards]
      summary: Card detail
      operationId: getCard
      responses:
        "200":
          description: Card detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Cards]
      summary: Update allowed card fields
      operationId: updateCard
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardRequest"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Cards]
      summary: Delete never-touched available card
      operationId: deleteCard
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/cards/{cardId}/reserve:
    post:
      tags: [Cards]
      summary: Reserve an available card
      operationId: reserveCard
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveCardRequest"
      responses:
        "200":
          description: Reserved card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/cards/{cardId}/unreserve:
    post:
      tags: [Cards]
      summary: Return a reserved card to available
      operationId: unreserveCard
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Unreserved card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/cards/{cardId}/sell:
    post:
      tags: [Cards]
      summary: Sell an available, reserved, or in-use card
      operationId: sellCard
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellCardRequest"
      responses:
        "200":
          description: Sold card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/cards/{cardId}/undo-sale:
    post:
      tags: [Cards]
      summary: Undo the latest sale and restore the sale snapshot
      operationId: undoSaleCard
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoSaleRequest"
      responses:
        "200":
          description: Sale reversed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/cards/{cardId}/use:
    post:
      tags: [Cards]
      summary: Record card usage
      operationId: useCard
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseCardRequest"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/cards/{cardId}/undo-usage:
    post:
      tags: [Cards]
      summary: Undo a non-write-off card usage
      operationId: undoUsageCard
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoUsageRequest"
      responses:
        "200":
          description: Usage reversed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/cards/{cardId}/void:
    post:
      tags: [Cards]
      summary: Void an active card and write off remaining balance
      operationId: voidCard
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidCardRequest"
      responses:
        "200":
          description: Voided card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/deals:
    get:
      tags: [Deals]
      summary: List deals
      operationId: listDeals
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Deals page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Deals]
      summary: Create a deal, optionally with cards
      operationId: createDeal
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDealRequest"
      responses:
        "201":
          description: Deal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/deals/{dealId}:
    parameters:
      - $ref: "#/components/parameters/DealId"
    get:
      tags: [Deals]
      summary: Deal detail with associated cards
      operationId: getDeal
      responses:
        "200":
          description: Deal detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Deals]
      summary: Update deal metadata with optimistic concurrency
      operationId: updateDeal
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDealRequest"
      responses:
        "200":
          description: Deal updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/deals/{dealId}/archive:
    post:
      tags: [Deals]
      summary: Archive a deal without removing cards
      operationId: archiveDeal
      parameters:
        - $ref: "#/components/parameters/DealId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Deal archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/deals/{dealId}/unarchive:
    post:
      tags: [Deals]
      summary: Restore an archived deal to the default list
      operationId: unarchiveDeal
      parameters:
        - $ref: "#/components/parameters/DealId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Deal unarchived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/reference-values:
    get:
      tags: [ReferenceValues]
      summary: List indexed deal names, sources, and card brands
      operationId: listReferenceValues
      parameters:
        - name: types
          in: query
          required: false
          schema:
            type: string
            example: deal_name,source,card_brand
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 160
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Reference values grouped by type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceValuesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [ReferenceValues]
      summary: Add or mark indexed reference values as used
      operationId: upsertReferenceValues
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertReferenceValuesRequest"
      responses:
        "200":
          description: Upserted reference values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceValueListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/cards/import-csv:
    post:
      tags: [ImportExport]
      summary: Preview CSV import
      operationId: previewCsvImport
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvImportRequest"
      responses:
        "200":
          description: Import preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectResponse"
  /api/cards/import-csv/confirm:
    post:
      tags: [ImportExport]
      summary: Confirm CSV import after server-side revalidation
      operationId: confirmCsvImport
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvImportRequest"
      responses:
        "201":
          description: CSV import committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/backup/export:
    post:
      tags: [ImportExport]
      summary: Plaintext JSON export
      operationId: exportPlaintextBackup
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaintextBackupExportRequest"
      responses:
        "200":
          description: Plaintext export file
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ObjectResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlaintextBackupPayload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/backup/export-encrypted:
    post:
      tags: [ImportExport]
      summary: Encrypted portable JSON export
      operationId: exportEncryptedBackup
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncryptedBackupExportRequest"
      responses:
        "200":
          description: Encrypted portable export file
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ObjectResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EncryptedPortableBackupPayload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/backup/import:
    post:
      tags: [ImportExport]
      summary: Import a JSON backup by merge or replace
      operationId: importBackup
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupImportRequest"
      responses:
        "201":
          description: Backup import completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupImportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/settings/backup:
    get:
      tags: [Settings]
      summary: Get backup settings and backup status
      operationId: getBackupSettings
      responses:
        "200":
          description: Backup settings
