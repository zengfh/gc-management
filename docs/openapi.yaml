        usages:
          type: array
          items:
            type: object
    EncryptedPortableBackupPayload:
      type: object
      required: [schemaVersion, exportType, payloadSchemaVersion, appVersion, exportedAt, encryptedAt, kdf, cipher]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        exportType:
          type: string
          enum: [encrypted_portable_json]
        payloadSchemaVersion:
          type: integer
          enum: [1]
        appVersion:
          type: string
        exportedAt:
          type: string
          format: date-time
        encryptedAt:
          type: string
          format: date-time
        kdf:
          type: object
          required: [name, salt, N, r, p, keyLength]
          properties:
            name:
              type: string
              enum: [scrypt]
            salt:
              type: string
              description: Base64-encoded salt.
            N:
              type: integer
              enum: [131072]
            r:
              type: integer
              enum: [8]
            p:
              type: integer
              enum: [1]
            keyLength:
              type: integer
              enum: [32]
        cipher:
          type: object
          required: [name, iv, authTag, ciphertext]
          properties:
            name:
              type: string
              enum: [aes-256-gcm]
            iv:
              type: string
              description: Base64-encoded initialization vector.
            authTag:
              type: string
              description: Base64-encoded GCM authentication tag.
            ciphertext:
              type: string
              description: Base64-encoded encrypted plaintext backup payload.
    PlaintextBackupExportRequest:
      type: object
      required: [unlockSecret, confirmation, acknowledgePlaintext]
      properties:
        unlockSecret:
          type: string
        confirmation:
          type: string
          enum: [EXPORT]
        acknowledgePlaintext:
          type: boolean
          enum: [true]
    EncryptedBackupExportRequest:
      type: object
      required: [unlockSecret, backupPassphrase, confirmation]
      properties:
        unlockSecret:
          type: string
        backupPassphrase:
          type: string
          minLength: 12
          description: Must not be the current unlock secret.
        backupPassphraseConfirmation:
          type: string
        confirmation:
          type: string
          enum: [ENCRYPT]
    BackupSettings:
      type: object
      required:
        - allowPlaintextExport
        - plaintextExportPolicyLocked
        - backupReminderDays
        - backupReminderDue
        - lastBackupAt
        - nextBackupDueAt
        - lastPlaintextExportAt
        - lastEncryptedExportAt
        - lastRawDatabaseExportAt
      properties:
        allowPlaintextExport:
          type: boolean
          description: Effective plaintext export availability after account settings and deployment policy are applied.
        plaintextExportPolicyLocked:
          type: boolean
          description: True when `GC_PLAINTEXT_EXPORT_ENABLED=false` prevents plaintext JSON export from being enabled.
        backupReminderDays:
          type: integer
          minimum: 0
          maximum: 365
          description: 0 disables the reminder.
        backupReminderDue:
          type: boolean
        lastBackupAt:
          type: string
          format: date-time
          nullable: true
        nextBackupDueAt:
          type: string
          format: date-time
          nullable: true
        lastPlaintextExportAt:
          type: string
          format: date-time
          nullable: true
        lastEncryptedExportAt:
          type: string
          format: date-time
          nullable: true
        lastRawDatabaseExportAt:
          type: string
          format: date-time
          nullable: true
